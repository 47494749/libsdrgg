name: Build for Raspberry Pi

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu libusb-1.0-0-dev

      - name: Build static library (aarch64)
        run: make static CXX=aarch64-linux-gnu-g++ AR=aarch64-linux-gnu-ar

      - name: Build shared library (aarch64)
        run: make CXX=aarch64-linux-gnu-g++

      - name: Package artifacts
        run: |
          mkdir -p release
          cp libsdrgg.a libsdrgg.so* sdrgg.h release/
          cd release && tar czf ../libsdrgg-arm64.tar.gz *

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: libsdrgg-arm64
          path: release/

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: libsdrgg-arm64.tar.gz
          generate_release_notes: true
