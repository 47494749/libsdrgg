name: Build for Raspberry Pi

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cross-compiler and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu libusb-1.0-0-dev

      - name: Build static library (aarch64)
        run: make static CXX=aarch64-linux-gnu-g++ AR=aarch64-linux-gnu-ar

      - name: Build shared library (aarch64)
        run: make CXX=aarch64-linux-gnu-g++

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: libsdrgg-arm64
          path: |
            libsdrgg.a
            libsdrgg.so*
            sdrgg.h
